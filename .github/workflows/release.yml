name: Release

# Publishing is a tag push: bump versionName/versionCode in app/build.gradle.kts,
# commit, then `git tag v1.0.0 && git push origin v1.0.0`. This workflow builds,
# signs with the keystore from repository secrets, and creates the GitHub
# Release the README badge points at.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KITE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KITE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KITE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KITE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash gradlew :app:assembleRelease

      - name: Rename release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Kite-${GITHUB_REF_NAME}.apk"
          ls -la Kite-*.apk

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kite-release-${{ github.ref_name }}-${{ steps.vars.outputs.sha7 }}
          path: Kite-*.apk
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Kite-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes
